# Weekly version updates (security updates are enabled in the repository settings)
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    groups:
      actions:
        patterns: ["*"]

  # The Editor bundle workflow adds the rebuilt haskell-editor.min.js to the PR
  - package-ecosystem: "npm"
    directory: "/editor"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    groups:
      editor:
        patterns: ["*"]
